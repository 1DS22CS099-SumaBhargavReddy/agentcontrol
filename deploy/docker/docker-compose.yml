version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentcontrol-postgres
    environment:
      POSTGRES_USER: agentcontrol
      POSTGRES_PASSWORD: agentcontrol_secret_pass
      POSTGRES_DB: agentcontrol
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcontrol"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentcontrol-redis
    ports:
      - "6385:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    container_name: agentcontrol-api
    environment:
      DATABASE_URL: postgresql+asyncpg://agentcontrol:agentcontrol_secret_pass@postgres:5432/agentcontrol
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    ports:
      - "8008:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: agentcontrol-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://agentcontrol:agentcontrol_secret_pass@postgres:5432/agentcontrol
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dashboard
    container_name: agentcontrol-dashboard
    ports:
      - "3008:80"
    depends_on:
      - api

volumes:
  pgdata:
