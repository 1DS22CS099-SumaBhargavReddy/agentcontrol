apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentcontrol-api
  namespace: agentcontrol
  labels:
    app: agentcontrol-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agentcontrol-api
  template:
    metadata:
      labels:
        app: agentcontrol-api
    spec:
      containers:
        - name: api
          image: ghcr.io/agentcontrol/api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentcontrol-secrets
                  key: database-url
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: agentcontrol-api
  namespace: agentcontrol
spec:
  type: ClusterIP
  selector:
    app: agentcontrol-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
